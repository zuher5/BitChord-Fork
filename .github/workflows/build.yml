# Build penuh di GitHub — mesin kerja lokal tidak punya JDK/Android SDK.
# Jalankan modul berurutan sesuai pola 3-modul: :shared → :sharedUi → :app.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :shared
        run: ./gradlew :shared:assembleDebug --stacktrace

      - name: Build :sharedUi
        run: ./gradlew :sharedUi:assembleDebug --stacktrace

      - name: Build APK :app (debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build APK :app (release)
        # Tanpa keystore.properties di CI, release keluar unsigned
        # (app-release-unsigned.apk) — Gradle-nya memang fallback begitu.
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-release-apk
          path: app/build/outputs/apk/**/release/*.apk
