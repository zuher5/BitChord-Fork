# One-off: generate signing keystore di runner (mesin kerja tak punya JDK),
# upload sebagai artifact sekali untuk dipindah ke GitHub Secrets, lalu
# workflow ini dihapus. Jangan dijalankan dua kali — keystore kedua tidak
# menggantikan identitas app yang sudah terpasang.
name: Bootstrap signing keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore + password acak
        run: |
          PASS=$(head -c 24 /dev/urandom | base64 | tr -d '+/=')
          keytool -genkeypair -v -keystore bitchord.jks -alias bitchord \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=BitChord Fork, OU=Personal, O=zuher5, C=ID"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=bitchord"
            echo "KEY_PASSWORD=$PASS"
          } > key.properties
          base64 -w0 bitchord.jks > bitchord.jks.b64

      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          retention-days: 1
          path: |
            bitchord.jks.b64
            key.properties
