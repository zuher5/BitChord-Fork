# CI cepat: build debug + unit test + lint. Tidak menyentuh keystore.
# Rilis bertanda tangan ditangani release.yml saat tag v*.*.* di-push.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pola 3-modul: :app:assembleDebug menarik :shared dan :sharedUi,
      # tapi cek eksplisit membuat sumber error langsung kelihatan.
      - name: Build :shared
        run: ./gradlew :shared:assembleDebug --stacktrace

      - name: Build :sharedUi
        run: ./gradlew :sharedUi:assembleDebug --stacktrace

      - name: Build APK debug (:app)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit test (:app)
        run: ./gradlew :app:testProdDebugUnitTest --stacktrace

      - name: Lint (:app)
        run: ./gradlew :app:lintProdDebug --stacktrace

      - name: Upload APK debug (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: musplay-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
