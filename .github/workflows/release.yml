# Rilis bertanda tangan, hanya saat tag v*.*.* di-push (lihat AGENTS.md
# §CI/CD). Hasilnya DRAFT — publish akhir tetap lewat review manusia
# (`gh release edit <tag> --draft=false` atau tombol di web).
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # KEYSTORE_PATH menunjuk file hasil decode; sisanya dari secrets —
      # kontrak yang dibaca app/build.gradle.kts.
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore dari secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum di-set — rilis signed tidak mungkin"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build APK release (arm64-v8a, signed)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release signing
        run: |
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          if echo "$APK" | grep -q unsigned; then
            echo "::error::Release APK unsigned — signing config tidak aktif"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify "$APK"
          echo "Signed OK: $APK"

      - name: Publish draft GitHub Release
        # Draft + changelog otomatis dari commit sejak tag sebelumnya.
        # Publish akhir manual: `gh release edit <tag> --draft=false`.
        uses: softprops/action-gh-release@v2
        with:
          name: MusPlay ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: app/build/outputs/apk/prod/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
